# Releases of this fork, for Riverside (Redeemer-Technologies/foundations), which pins them.
#
# Pushing a tag that starts with v (such as v13.0.3-rt.1) builds the native module from that commit
# for Linux (glibc and musl) and Windows, x64 and arm64, runs the test suite against it, and attaches
# the binaries to a GitHub release with SHA256SUMS. linux-x64 is required; the rest are best-effort. Nothing is published to npm. It is this fork's only workflow: upstream's (build,
# bump-version, update-sqlite) are removed.
#
# The module uses Node-API, so one binary serves every Node version from 22 (package.json "engines").
# Linux glibc builds are made in Debian bookworm (glibc 2.36), so they run there and on anything newer,
# such as trixie, which Riverside's images use. lib/binding.js loads prebuilds/<platform>-<arch>.node
# before anything node-gyp built: a consumer puts the binary there.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag names the upstream release it is based on and a revision of this fork's changes on top:
  # v13.0.3-rt.1, v13.0.3-rt.2, then v13.1.0-rt.1 after merging upstream's v13.1.0. The upstream
  # release must be the newest one in the tagged commit's history, so the name cannot claim another.
  check:
    name: Check the tag names its upstream release
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.base.outputs.base }}
      base_sha: ${{ steps.base.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: base
        name: Find the newest upstream release this commit contains
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-rt\.[1-9][0-9]*$ ]]; then
            echo "::error::Name the tag <upstream release>-rt.<revision>, such as v13.0.3-rt.1, not $GITHUB_REF_NAME"
            exit 1
          fi
          claimed="${BASH_REMATCH[1]}"
          # Upstream's release tags and the commits they name (for an annotated tag, its ^{} line).
          git ls-remote --tags https://github.com/WiseLibs/better-sqlite3.git \
            | awk '{ sub("refs/tags/", "", $2); peeled = sub(/\^\{\}$/, "", $2); if (peeled || !($2 in sha)) sha[$2] = $1 }
                   END { for (t in sha) print t, sha[t] }' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+ ' | sort -V > upstream-releases.txt
          base='' base_sha=''
          while read -r tag sha; do
            if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then base="$tag" base_sha="$sha"; fi
          done < upstream-releases.txt
          if [ -z "$base" ]; then echo "::error::This commit contains no upstream release"; exit 1; fi
          if [ "$base" != "$claimed" ]; then
            echo "::error::$GITHUB_REF_NAME says it is based on $claimed, but the newest upstream release in its history is $base: name it $base-rt.<revision>"
            exit 1
          fi
          echo "Based on upstream $base ($base_sha)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

  linux:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, image: 'node:24-bookworm', setup: '' }
          - { target: linux-arm64, os: ubuntu-24.04-arm, image: 'node:24-bookworm', setup: '' }
          - { target: linuxmusl-x64, os: ubuntu-24.04, image: 'node:24-alpine', setup: 'apk add --no-cache build-base python3 py3-setuptools' }
          - { target: linuxmusl-arm64, os: ubuntu-24.04-arm, image: 'node:24-alpine', setup: 'apk add --no-cache build-base python3 py3-setuptools' }
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in ${{ matrix.image }}
        run: |
          docker run --rm --volume "$PWD:/project" --workdir /project '${{ matrix.image }}' sh -euc '
            ${{ matrix.setup }}
            npm install --ignore-scripts --no-audit --no-fund
            npm run build-release
            npm test
            mkdir -p prebuilds
            cp build/Release/better_sqlite3.node prebuilds/${{ matrix.target }}.node
            node -e "const D = require(\"./lib\"); const db = new D(\":memory:\", { nativeBinding: \"prebuilds/${{ matrix.target }}.node\" }); console.log(\"SQLite\", db.prepare(\"SELECT sqlite_version() AS v\").get().v); db.close()"
          '
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}.node
          if-no-files-found: error

  # No macOS builds: Riverside does not support it.
  windows:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, os: windows-2022 }
          - { target: win32-arm64, os: windows-11-arm }
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip.exe install setuptools
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build-release
      - run: npm test
      - name: Check the binary loads from prebuilds/
        run: |
          mkdir -p prebuilds
          cp build/Release/better_sqlite3.node prebuilds/${{ matrix.target }}.node
          node -e "const D = require('./lib'); const db = new D(':memory:', { nativeBinding: 'prebuilds/${{ matrix.target }}.node' }); console.log('SQLite', db.prepare('SELECT sqlite_version() AS v').get().v); db.close()"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}.node
          if-no-files-found: error

  # Riverside needs linux-x64, so a release needs it. The other platforms are best-effort: a build
  # that fails, or never gets a runner, is left out and named in the release notes. needs.<job>.result
  # covers a whole matrix, so what was built is read from the artifacts instead.
  release:
    needs: [check, linux, windows]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    name: Publish the GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Name the binaries and checksum them
        run: |
          mkdir release
          missing=''
          for target in linux-x64 linux-arm64 linuxmusl-x64 linuxmusl-arm64 win32-x64 win32-arm64; do
            if [ -f "artifacts/$target/$target.node" ]; then
              cp "artifacts/$target/$target.node" "release/better-sqlite3-$GITHUB_REF_NAME-$target.node"
            elif [ "$target" = linux-x64 ]; then
              echo "::error::linux-x64 did not build, and Riverside needs it: no release"
              exit 1
            else
              echo "::warning::$target did not build; the release leaves it out"
              missing="$missing $target"
            fi
          done
          echo "MISSING=${missing# }" >> "$GITHUB_ENV"
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.check.outputs.base }}
          BASE_SHA: ${{ needs.check.outputs.base_sha }}
        run: |
          linux=$(grep -- '-linux-x64.node$' release/SHA256SUMS | cut -d' ' -f1)
          changes=$(git log --no-merges --format='- %s (%h)' "$BASE_SHA..$GITHUB_SHA")
          cat > notes.md <<EOF
          Based on upstream [$BASE](https://github.com/WiseLibs/better-sqlite3/releases/tag/$BASE), with these commits on top:

          $changes

          Built from $GITHUB_SHA. Node-API, for Node 22 and later. Put a binary at
          \`node_modules/better-sqlite3/prebuilds/<platform>-<arch>.node\`, where lib/binding.js loads it first.

          To pin it in Riverside: point \`better-sqlite3\` in package.json at
          \`https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA\`, and set in api/Dockerfile:

          \`\`\`
          ARG BETTER_SQLITE3_RELEASE=$GITHUB_REF_NAME
          ARG BETTER_SQLITE3_SHA256=$linux
          \`\`\`
          EOF
          if [ -n "$MISSING" ]; then
            printf '\nNot built this time, so not included: %s. Build them from source with `npm run build-release`.\n' "$MISSING" >> notes.md
          fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
